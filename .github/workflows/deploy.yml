name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages (production)
        # Zonder --branch=<productiebranch> wordt de upload een Preview en verandert de live site niet.
        # De productiebranch van het project wordt daarom opgevraagd bij Cloudflare.
        run: |
          PB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/smylee" \
            | jq -r '.result.production_branch // empty' || true)
          PB=${PB:-main}
          echo "Productiebranch van smylee: $PB"
          npx --yes wrangler pages deploy . --project-name=smylee --branch="$PB" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
