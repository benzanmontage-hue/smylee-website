<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smylee Whitening Studio</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.smyleetandenbleker.nl/#faq">
<meta http-equiv="refresh" content="0; url=./#faq">
<style>body{margin:0;font:16px/1.6 system-ui,sans-serif;background:#FBF8F3;color:#1F1C19;display:grid;place-items:center;min-height:100vh}a{color:#7E6036}</style>
</head>
<body>
<p>Deze pagina is verhuisd. <a href="./#faq">Ga naar de nieuwe pagina</a>.</p>
<script>location.replace('./#faq')</script>
<!-- Cookie consent (EU) -->
<div id="cookieConsent" style="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#1f2430;color:#e8e8ec;padding:16px 22px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;box-shadow:0 -4px 24px rgba(0,0,0,.3);">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
    <div style="flex:1;min-width:260px;line-height:1.55;">
      We gebruiken cookies voor een optimale werking van de site.
      <a href="https://www.smyleetandenbleker.nl/cookiebeleid/" style="color:#8ab4ff;text-decoration:underline;">Meer info</a>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button onclick="cookieDone('declined')" style="background:transparent;color:#e8e8ec;border:1px solid #4a5060;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;">Weigeren</button>
      <button onclick="cookieDone('accepted')" style="background:#3b82f6;color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;">Accepteren</button>
    </div>
  </div>
</div>
<script>
function cookieDone(v){try{localStorage.setItem('cookie-consent',v);}catch(e){}var b=document.getElementById('cookieConsent');if(b){b.remove();}}
(function(){try{if(localStorage.getItem('cookie-consent')){var b=document.getElementById('cookieConsent');if(b){b.remove();}}}catch(e){}})();
</script>

</body>
</html>
